# Theme for the Robotic Programme Decision Tool (v0.8).
# Font is Arial (system font); ./static holds the favicon.

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"        # hides the Deploy button and developer options
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[theme]
# v0.8: plain, high-contrast style familiar to NHS users (Arial, black text, simple tables).
# Not an NHS product: no NHS name, logo or colour palette is used.
base = "light"
primaryColor = "#0B0C0C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F2F1"
textColor = "#0B0C0C"
linkColor = "#0B0C0C"
borderColor = "#B1B4B6"
showWidgetBorder = true
baseRadius = "none"
font = "Arial"
headingFont = "Arial"
headingFontWeights = [700, 700, 700, 700, 700, 700]
baseFontSize = 16

[theme.sidebar]
backgroundColor = "#F3F2F1"
